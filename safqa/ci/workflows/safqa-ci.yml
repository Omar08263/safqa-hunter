name: safqa-ci
on:
  push: { paths: ['safqa/**', '.github/workflows/safqa-*.yml'] }
  pull_request: { paths: ['safqa/**', '.github/workflows/safqa-*.yml'] }
  workflow_dispatch:
permissions: { contents: read, pull-requests: read }
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'safqa/src/**'
              - 'safqa/test/**'
              - 'safqa/package.json'
              - 'safqa/package-lock.json'
              - 'safqa/tsconfig.json'
              - 'safqa/vitest.config.*'
              - '.github/workflows/safqa-*.yml'
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: safqa } }
    steps:
      - uses: actions/checkout@v4
      # NOTE: package-manager-cache stays OFF on purpose — the repo root's devEngines forces pnpm,
      # so setup-node's npm cache step dies with EBADDEVENGINES (see commit a5e5966). We cache manually.
      - uses: actions/setup-node@v4
        with: { node-version: 22, package-manager-cache: false }
      - name: prepare cache dirs (npm, Playwright browsers, ONNX models)
        run: mkdir -p ~/.cache/ms-playwright models
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
            safqa/models
          key: 'safqa-deps-${{ hashFiles(''safqa/package-lock.json'') }}'
          restore-keys: 'safqa-deps-'
      - run: npm ci
      - run: npm run typecheck
      # Vitest regression suite: extraction fixtures live inline in safqa/test/*.test.ts
      # (JSON-LD shapes, scheduler, matching, politeness) — no live pages are fetched.
      - name: Vitest regression (extraction fixtures)
        run: npm test
