name: safqa-ci
on:
  push: { paths: ['safqa/**', '.github/workflows/safqa-*.yml'] }
  pull_request: { paths: ['safqa/**'] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: safqa } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, package-manager-cache: false }
      - uses: actions/cache@v4
        with: { path: ~/.npm, key: 'npm-${{ hashFiles(''safqa/package-lock.json'') }}', restore-keys: 'npm-' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
